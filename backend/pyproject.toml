[project]
name = "harvestlink-backend"
version = "0.1.0"
description = "HarvestLink AI Agent Backend - Surplus produce grading, pricing, buyer matching, and Careem Box delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "boto3>=1.35.40",
    "botocore>=1.35.40",
    "mcp>=1.0.0",
    "httpx>=0.27.2",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
